name: Security

# Report-only while the first results are reviewed: every scanner uploads its report as an artifact
# and to GitHub Code Scanning (Security tab), and none of them fails the run. Blocking is switched on per job by changing `exit-code` to "1"
# (or removing `continue-on-error`) once the findings are triaged.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Install Gitleaks
        run: |
          version="8.28.0"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" | tar -xz gitleaks
      - name: Scan git history
        continue-on-error: true
        run: ./gitleaks git --redact --report-format sarif --report-path gitleaks.sarif --exit-code 1 .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: gitleaks
          path: gitleaks.sarif
          if-no-files-found: ignore
      - uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4
        if: always() && hashFiles('gitleaks.sarif') != ''
        continue-on-error: true
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

  trufflehog:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Scan for verified secrets
        continue-on-error: true
        run: |
          docker run --rm -v "$PWD:/repo" trufflesecurity/trufflehog:latest \
            git file:///repo --results=verified,unknown --json --no-update > trufflehog.json
          python3 - <<'PY'
          import json
          results = []
          for line in open("trufflehog.json"):
              line = line.strip()
              if not line.startswith("{"):
                  continue
              finding = json.loads(line)
              if "DetectorName" not in finding:
                  continue
              git = finding.get("SourceMetadata", {}).get("Data", {}).get("Git", {})
              verified = finding.get("Verified", False)
              results.append({
                  "ruleId": finding["DetectorName"],
                  "level": "error" if verified else "warning",
                  "message": {"text": finding["DetectorName"] + (" (verified active)" if verified else " (unverified) in commit " + git.get("commit", "")[:8])},
                  "locations": [{"physicalLocation": {
                      "artifactLocation": {"uri": git.get("file", "unknown")},
                      "region": {"startLine": max(git.get("line", 1), 1)}}}],
                  "partialFingerprints": {"primaryLocationLineHash": finding.get("DetectorName", "") + git.get("commit", "") + git.get("file", "") + str(git.get("line", 0))},
              })
          rules = [{"id": rule} for rule in sorted({r["ruleId"] for r in results})]
          sarif = {"version": "2.1.0", "$schema": "https://json.schemastore.org/sarif-2.1.0.json",
                   "runs": [{"tool": {"driver": {"name": "TruffleHog", "rules": rules}}, "results": results}]}
          json.dump(sarif, open("trufflehog.sarif", "w"))
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: trufflehog
          path: trufflehog.sarif
          if-no-files-found: ignore
      - uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4
        if: always() && hashFiles('trufflehog.sarif') != ''
        continue-on-error: true
        with:
          sarif_file: trufflehog.sarif
          category: trufflehog

  semgrep:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    container:
      image: semgrep/semgrep:latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Scan with community rules
        continue-on-error: true
        run: >
          semgrep scan
          --config p/default
          --config p/nginx
          --config p/jwt
          --config p/owasp-top-ten
          --config p/secrets
          --config p/dockerfile
          --exclude build
          --exclude-rule javascript.lang.security.detect-insecure-websocket.detect-insecure-websocket
          --sarif --output semgrep.sarif
          --error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: semgrep
          path: semgrep.sarif
          if-no-files-found: ignore
      - uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4
        if: always() && hashFiles('semgrep.sarif') != ''
        continue-on-error: true
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  trivy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Dependencies, secrets and misconfiguration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
          format: sarif
          output: trivy-fs.sarif
          exit-code: "0"
      - name: Dockerfile and compose configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          severity: MEDIUM,HIGH,CRITICAL
          trivyignores: .trivyignore.yaml
          format: sarif
          output: trivy-config.sarif
          exit-code: "0"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: trivy
          path: |
            trivy-fs.sarif
            trivy-config.sarif
          if-no-files-found: ignore
      - uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4
        if: always() && hashFiles('trivy-config.sarif') != ''
        continue-on-error: true
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config
      - uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4
        if: always() && hashFiles('trivy-fs.sarif') != ''
        continue-on-error: true
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  osv-scanner:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Scan lockfiles
        continue-on-error: true
        run: |
          scan_status=0
          docker run --rm -v "$PWD:/src" -w /src ghcr.io/google/osv-scanner:latest \
            scan source --recursive --format sarif --output-file osv.sarif . || scan_status=$?
          if [ -f osv.sarif ]; then
            sed -i 's#file:///src/##g' osv.sarif
          fi
          exit "$scan_status"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: osv-scanner
          path: osv.sarif
          if-no-files-found: ignore
      - uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4
        if: always() && hashFiles('osv.sarif') != ''
        continue-on-error: true
        with:
          sarif_file: osv.sarif
          category: osv-scanner

  syft-grype:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: false
      - name: Scan SBOM
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7
        with:
          sbom: sbom.cdx.json
          severity-cutoff: high
          fail-build: false
          output-format: sarif
          output-file: grype.sarif
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: syft-grype
          path: |
            sbom.cdx.json
            grype.sarif
          if-no-files-found: ignore
      - uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4
        if: always() && hashFiles('grype.sarif') != ''
        continue-on-error: true
        with:
          sarif_file: grype.sarif
          category: grype

  hadolint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5 # v3.3.0
        continue-on-error: true
        with:
          dockerfile: Dockerfile
          format: sarif
          output-file: hadolint.sarif
          no-fail: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: hadolint
          path: hadolint.sarif
          if-no-files-found: ignore
      - uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4
        if: always() && hashFiles('hadolint.sarif') != ''
        continue-on-error: true
        with:
          sarif_file: hadolint.sarif
          category: hadolint

  scorecard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        continue-on-error: true
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: scorecard
          path: scorecard.sarif
          if-no-files-found: ignore
      - uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4
        if: always() && hashFiles('scorecard.sarif') != ''
        continue-on-error: true
        with:
          sarif_file: scorecard.sarif
          category: scorecard
