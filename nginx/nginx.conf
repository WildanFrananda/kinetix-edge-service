worker_processes auto;
daemon off;
pid logs/nginx.pid;
error_log stderr warn;

env EDGE_REDIS_HOST;
env EDGE_REDIS_PORT;
env EDGE_REDIS_USER;
env EDGE_REDIS_PASSWORD;
env IDENTITY_HTTP_URL;
env EDGE_API_UPSTREAM;
env KINETIX_BACKOFFICE_HOST;
env KINETIX_SELLER_HOST;
env KINETIX_SERVICE_VERSION;

events {
    worker_connections 1024;
}

http {
    lua_package_path "$prefix/lua/?.lua;;";
    lua_code_cache on;
    lua_shared_dict edge_metrics 4m;
    lua_socket_log_errors off;

    resolver local=on ipv6=off valid=30s;
    resolver_timeout 2s;

    server_tokens off;
    access_log off;
    default_type application/json;

    client_body_temp_path temp/client_body;
    proxy_temp_path temp/proxy;
    fastcgi_temp_path temp/fastcgi;
    uwsgi_temp_path temp/uwsgi;
    scgi_temp_path temp/scgi;

    client_max_body_size 1m;
    client_body_buffer_size 1m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 65s;

    init_by_lua_block {
        require("http.startup").run()
    }

    server {
        listen 8080;
        server_name _;

        set $edge_route "unmatched";
        set $edge_request_id "";
        set $edge_app "";
        set $edge_session_tag "";
        set $edge_socket_upstream "";
        set $edge_socket_host "";
        set $edge_socket_protocol "";
        set $edge_client_address "";

        more_clear_headers Server;

        error_page 400 = @nginx_400;
        error_page 413 = @nginx_413;
        error_page 414 = @nginx_414;
        error_page 494 = @nginx_494;
        error_page 500 = @nginx_500;

        header_filter_by_lua_block {
            require("http.response_headers").filter()
        }

        log_by_lua_block {
            require("http.access_log").write()
        }

        location / {
            content_by_lua_block {
                require("http.router").serve()
            }
        }

        location @merchant_socket {
            proxy_pass $edge_socket_upstream;
            proxy_http_version 1.1;
            proxy_pass_request_headers off;
            proxy_pass_request_body off;
            proxy_set_header Host $edge_socket_host;
            proxy_set_header Upgrade websocket;
            proxy_set_header Connection upgrade;
            proxy_set_header Sec-WebSocket-Key $http_sec_websocket_key;
            proxy_set_header Sec-WebSocket-Version $http_sec_websocket_version;
            proxy_set_header Sec-WebSocket-Extensions $http_sec_websocket_extensions;
            proxy_set_header Sec-WebSocket-Protocol $edge_socket_protocol;
            proxy_set_header User-Agent $http_user_agent;
            proxy_set_header X-Request-Id $edge_request_id;
            proxy_set_header X-Forwarded-For $edge_client_address;
            proxy_set_header X-Forwarded-Proto https;
            proxy_next_upstream off;
            proxy_buffering off;
            proxy_connect_timeout 2s;
            proxy_send_timeout 90s;
            proxy_read_timeout 90s;
            send_timeout 90s;

            error_page 500 = @nginx_500;
            error_page 502 504 = @merchant_socket_unavailable;

            header_filter_by_lua_block {
                require("http.merchant_socket").answer()
            }
        }

        location @merchant_socket_unavailable {
            content_by_lua_block {
                require("http.merchant_socket").unavailable()
            }
        }

        location @nginx_400 {
            content_by_lua_block {
                require("http.nginx_error").serve(400)
            }
        }

        location @nginx_413 {
            content_by_lua_block {
                require("http.nginx_error").serve(413)
            }
        }

        location @nginx_414 {
            content_by_lua_block {
                require("http.nginx_error").serve(414)
            }
        }

        location @nginx_494 {
            content_by_lua_block {
                require("http.nginx_error").serve(494)
            }
        }

        location @nginx_500 {
            content_by_lua_block {
                require("http.nginx_error").serve(500)
            }
        }
    }

    server {
        listen 9145;
        server_name _;

        more_clear_headers Server;

        location = /metrics {
            content_by_lua_block {
                require("http.metrics_endpoint").serve()
            }
        }

        location / {
            return 404;
        }
    }
}
