worker_processes 1;
daemon off;
pid logs/nginx.pid;
error_log stderr warn;

events {
    worker_connections 256;
}

http {
    lua_package_path "$prefix/lua/?.lua;;";
    access_log off;
    client_body_temp_path temp/client_body;
    proxy_temp_path temp/proxy;
    fastcgi_temp_path temp/fastcgi;
    uwsgi_temp_path temp/uwsgi;
    scgi_temp_path temp/scgi;
    client_max_body_size 4m;
    client_body_buffer_size 4m;

    init_by_lua_block {
        require("cjson.safe").encode_escape_forward_slash(false)
        require("tests.integration.fakes.identity")
    }

    server {
        listen 127.0.0.1:18001;

        location / {
            content_by_lua_block {
                require("tests.integration.fakes.identity").serve()
            }
        }
    }

    server {
        listen 127.0.0.1:18002;

        location / {
            content_by_lua_block {
                require("tests.integration.fakes.api").serve()
            }
        }
    }
}
